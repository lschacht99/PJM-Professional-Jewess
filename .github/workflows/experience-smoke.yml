name: Experience UX smoke tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'opportunities.html'
      - 'partners.html'
      - 'assets/experience-drawer.js'
      - 'assets/experience-drawer.css'
      - 'assets/jm-home.css'
      - 'assets/jm-discovery.css'
      - 'assets/jm-discovery.js'
      - 'tests/experience-smoke.cjs'
      - '.github/workflows/experience-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local static server and test user flows
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/experience-smoke.cjs
