name: Experience UX smoke tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'opportunities.html'
      - 'partners.html'
      - 'about.html'
      - 'join.html'
      - 'contact.html'
      - 'resources.html'
      - 'privacy.html'
      - 'understanding-jewish-life.html'
      - 'challenge-product.html'
      - 'experience-architecture.html'
      - 'applied.html'
      - '404.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/experience-drawer.js'
      - 'assets/experience-drawer.css'
      - 'assets/jm-home.css'
      - 'assets/jm-discovery.css'
      - 'assets/jm-discovery.js'
      - 'tests/experience-smoke.cjs'
      - 'tests/release-audit.cjs'
      - 'tests/confirmation-smoke.cjs'
      - 'tests/gmail-bridge-smoke.cjs'
      - 'supabase/functions/jm-confirmation/**'
      - 'ops/sql/pj-confirmation-outbox.sql'
      - 'ops/AUTOMATIC-CONFIRMATIONS.md'
      - 'ops/GMAIL-SENDER-SETUP.md'
      - 'google-apps-script/**'
      - '.github/workflows/experience-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secure confirmation templates and backend logic
        run: |
          node tests/confirmation-smoke.cjs
          node tests/gmail-bridge-smoke.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check deployed confirmation Edge Function TypeScript
        run: deno check supabase/functions/jm-confirmation/index.ts
      - name: Verify links, metadata and launch routing
        run: node tests/release-audit.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local static server and test user flows
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/experience-smoke.cjs
